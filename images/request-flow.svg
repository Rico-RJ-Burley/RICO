<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 240" role="img" aria-labelledby="t">
  <title id="t">Diagram: browser asks DNS for an address, sends an HTTP request to the web server, and gets a response</title>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16233a"/>
    </marker>
  </defs>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle">
    <rect x="20" y="80" width="150" height="80" rx="8" fill="#e3f1f2" stroke="#0e7c86" stroke-width="2"/>
    <text x="95" y="115" font-weight="bold" fill="#16233a">Your browser</text>
    <text x="95" y="137" fill="#4a5a72" font-size="13">(the client)</text>

    <rect x="305" y="10" width="150" height="60" rx="8" fill="#ffffff" stroke="#c9d3df" stroke-width="2"/>
    <text x="380" y="38" font-weight="bold" fill="#16233a">DNS</text>
    <text x="380" y="57" fill="#4a5a72" font-size="13">name to IP address</text>

    <rect x="590" y="80" width="150" height="80" rx="8" fill="#16233a"/>
    <text x="665" y="115" font-weight="bold" fill="#ffffff">Web server</text>
    <text x="665" y="137" fill="#8fd3da" font-size="13">Apache / Nginx</text>

    <path d="M150 80 L305 45" stroke="#16233a" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="205" y="50" font-size="13" fill="#16233a">1. Where is the site?</text>

    <path d="M180 108 L585 108" stroke="#16233a" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="380" y="100" font-size="13" font-family="monospace" fill="#0e7c86">2. GET /index.html HTTP/1.1</text>

    <path d="M590 140 L175 140" stroke="#16233a" stroke-width="2" fill="none" marker-end="url(#a)"/>
    <text x="380" y="160" font-size="13" font-family="monospace" fill="#2f8f4e">3. HTTP/1.1 200 OK + HTML, CSS, images</text>

    <text x="380" y="215" font-size="13" fill="#4a5a72">4. The browser assembles the files into the page you see</text>
  </g>
</svg>
